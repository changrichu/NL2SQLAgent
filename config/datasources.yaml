# Datasource registry — declare every read-only data source the agent can talk to.
# Each entry maps a friendly name (used by the API/UI) to a connector class
# and its connection parameters.

datasources:
  postgres:
    type: postgres
    host: ${POSTGRES_HOST}
    port: ${POSTGRES_PORT}
    database: ${POSTGRES_DB}
    user: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}

